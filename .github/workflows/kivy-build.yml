name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Build APK with Kivy Buildozer
      uses: mrin9/actions-buildozer@v0.1.3
      with:
        workdir: '.'
        target: 'android debug'
        buildozer_version: '1.5.0'
        python_version: '3.8'
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: seabattle-apk
        path: bin/*.apk