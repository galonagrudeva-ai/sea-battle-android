name: Debug Build

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Buildozer
      run: |
        sudo apt update
        sudo apt install -y python3-pip wget unzip
        pip install buildozer==1.5.0 cython==0.29.36
    
    - name: Create test app
      run: |
        # Минимальная рабочая Kivy app
        cat > main.py << 'EOF'
import kivy
kivy.require('2.1.0')

from kivy.app import App
from kivy.uix.label import Label

class SeaBattle(App):
    def build(self):
        return Label(text='Морской Бой\nЗагружается...')

if __name__ == '__main__':
    SeaBattle().run()
EOF
        
        cat > buildozer.spec << 'EOF'
[app]
title = Sea Battle
package.name = seabattle
package.domain = com.test
source.dir = .
source.main = main.py
version = 0.1

requirements = python3, kivy==2.1.0

orientation = portrait
fullscreen = 0

android.api = 33
android.minapi = 24
android.sdk = 33
android.ndk = 25b
android.archs = arm64-v8a

android.accept_sdk_license = True

[buildozer]
log_level = 2
EOF
    
    - name: Try to build with detailed logs
      run: |
        echo "=== Starting buildozer ==="
        timeout 300 buildozer android debug 2>&1 | tee build.log || true
        
        echo "=== Check if APK exists ==="
        ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
        
        echo "=== Last 50 lines of build.log ==="
        tail -50 build.log || true
        
        echo "=== Check for errors ==="
        grep -i "error\|failed\|exception" build.log | tail -20 || true
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build.log
          .buildozer/
        retention-days: 7